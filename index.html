<style>
:root{--bg:#F6F4EF;--sf:#fff;--ink:#1A1A1A;--mut:#5E5A52;--ln:#CFC9BC;--ac:#C42418;--onac:#fff;--ok:#0F6B4A;--bad:#B3261E;--ph:#E6E1D6;--dk:#1A1A1A;--ondk:#fff;

html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between}

#toast[hidden]{display:none}
#sheet{opacity:0;transition:opacity .28s ease}
#sheet.on{opacity:1}
.panel{transform:translateY(32px);transition:transform .34s cubic-bezier(.2,.8,.2,1)}

.panel.pa>*{animation:fin .3s ease backwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}

.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
.enter>:nth-child(2){animation-delay:.04s}.enter>:nth-child(3){animation-delay:.08s}.enter>:nth-child(4){animation-delay:.12s}.enter>:nth-child(5){animation-delay:.16s}.enter>:nth-child(6){animation-delay:.2s}.enter>:nth-child(7){animation-delay:.24s}.enter>:nth-child(n+8){animation-delay:.28s}
.card,.tile,.chip,.btn,.ghost,.fab,.menu{transition:transform .15s ease,background-color .25s ease,border-color .25s ease,color .25s ease}
.card:active,.tile:active,.chip:active,.btn:active,.ghost:active,.fab:active,.menu:active{transform:scale(.97)}
.fab{animation:pop .45s cubic-bezier(.2,1.4,.4,1) .15s backwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
#toast{animation:tin .25s ease}

#th svg{animation:spin .5s cubic-bezier(.2,.8,.2,1)}

.sw2{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ln);padding:0;flex:none;box-sizing:border-box}

.sw2.cu{position:relative;overflow:hidden;display:block;background:conic-gradient(#e53935,#fdd835,#43a047,#00acc1,#1e88e5,#8e24aa,#e53935)}

.wrap{max-width:960px;padding:36px 32px 120px}

.panel{max-width:620px;max-height:90%;border-radius:22px;padding:22px 24px 24px;transform:translateY(18px) scale(.98)}

}

<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],q='',f='Semua',dl=null,tt,hid=[],opt={};
try{const r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)}catch(e){}

try{opt=JSON.parse(localStorage.getItem('diecast:opt')||'{}')||{}}catch(e){opt={}}
for(const k in K)if(!Array.isArray(opt[k]))opt[k]=k==='brand'?BR.filter(x=>!hid.includes(x)):[...K[k].d];
function topf(i){const p=i.ps;i.qty=p.length;Object.assign(i,{pack:p[0].pack,state:p[0].state,minus:p[0].minus,year:p[0].year,price:p[0].price,loc:[...new Set(p.map(x=>x.loc).filter(Boolean))].join(', ')});const cp=p.find(x=>x.ph.length);i.photo=cp?cp.ph[Math.min(cp.th||0,cp.ph.length-1)]:'';i.sq=i.sell?p.filter(x=>x.s).length:0}

const Q=i=>i.qty||1,SQ=i=>i.sell?Math.min(Q(i),i.sq||Q(i)):0;

const GN={none:'Tanpa grup',brand:'Merek',series:'Seri',pack:'Kemasan',state:'Kondisi',seller:'Seller',scale:'Skala',year:'Tahun beli',loc:'Lokasi',status:'Status'};
const gv=a=>{const u=uniq(a);return u.length>1?'Campur':(u[0]||'')};

const fv=(i,x)=>x==='pack'||x==='state'?PS(i).map(p=>p[x]):[i[x]];
const cardHtml=i=>`<button class="card" data-id="${esc(i.id)}"><div class="th">${i.photo?`<img alt="" src="${i.photo}">`:''}</div><div class="mid"><b>${esc(i.name)}</b><span>${esc([i.brand,i.scale,i.po?i.seller:i.year,Q(i)>1?Q(i)+' pcs':''].filter(Boolean).join(' · '))}</span><div class="tags">${pill(i)}${i.po?`<span class="jl po">PO${i.eta?' · ETA '+esc(fm(i.eta)):''}</span>`:''}${i.sold?`<span class="jl sd">TERJUAL${Q(i)>1?' ×'+Q(i):''}${i.ch?' · '+esc(i.ch):''} · ${k1(i.sg)}</span>`:i.sell?`<span class="jl">DIJUAL${Q(i)>1?' '+SQ(i)+'/'+Q(i):''}</span>`:''}</div></div><div class="pr">${TP(i)?money(TP(i)):''}</div></button>`;
function render(){
  const act=items.filter(i=>!i.sold&&!i.po),hs=items.some(i=>i.sell&&!i.sold),hd=items.some(i=>i.sold),hp=items.some(i=>i.po&&!i.sold);
  const fs=['Semua',...(hp?['Pre Order']:[]),...(hs?['Dijual']:[]),...(hd?['Terjual']:[])];
  if(!fs.includes(f))f='Semua';
  $('#n').innerHTML=act.reduce((a,i)=>a+Q(i),0)+(hp?` <span style="font-size:12px;font-weight:400;opacity:.75">+${items.filter(i=>i.po&&!i.sold).reduce((a,i)=>a+Q(i),0)} PO</span>`:'');$('#v').textContent=short(act.reduce((a,i)=>a+TP(i),0));
  {const po=items.filter(i=>i.po&&!i.sold),sl=items.filter(i=>i.sell&&!i.sold),sd=items.filter(i=>i.sold),U=a=>a.reduce((x,i)=>x+Q(i),0);
   $('#s_po').textContent=U(po);$('#s_po2').textContent=short(po.reduce((a,i)=>a+TP(i),0));
   $('#s_sl').textContent=sl.reduce((x,i)=>x+SQ(i),0);$('#s_sl2').textContent=short(sl.reduce((a,i)=>a+(i.sp||0)*SQ(i),0));
   $('#s_sd').textContent=U(sd);$('#s_sd2').textContent=short(sd.reduce((a,i)=>a+(i.sg||0)*Q(i),0))}
  $('#chips').innerHTML=fs.map(b=>`<button class="chip" data-b="${esc(b)}" aria-pressed="${b===f}">${esc(b)}</button>`).join('');
  const k=q.trim().toLowerCase();
  const pass=i=>f==='Semua'?!i.sold:f==='Pre Order'?i.po&&!i.sold:f==='Dijual'?i.sell&&!i.sold:f==='Terjual'?i.sold:!i.sold;
  const l=items.filter(i=>pass(i)&&Object.keys(flt).every(x=>!flt[x].length||fv(i,x).some(v=>flt[x].includes(v)))&&(!k||[i.name,i.brand,i.series,i.loc,i.scale,i.seller].join(' ').toLowerCase().includes(k))).sort(SORTS[sort][1]);
  shown=l.length;const L=$('#list');L.className=(view==='tile'?'grid'+(tsz<105?' sm':''):'list')+(enter?' enter':'');enter=false;L.style.setProperty('--tile',tsz+'px');L.style.setProperty('--th',Math.round(tsz*.55)+'px');
  const nf=Object.values(flt).reduce((a,v)=>a+v.length,0);$('#fc').textContent=nf;$('#fc').hidden=!nf;$('#fl').setAttribute('aria-label','Filter'+(nf?` (${nf} aktif)`:''));

  $('#sum').textContent=!l.length?'':f==='Terjual'?'Total terjual '+money(l.reduce((a,i)=>a+(i.sg||0)*Q(i),0)):f==='Pre Order'?l.length+' PO · total '+money(l.reduce((a,i)=>a+TP(i),0)):'';

      [...m.keys()].sort((a,b)=>a.localeCompare(b,'id',{numeric:true})).forEach(g=>{const a=m.get(g),c=gcol.has(grp+':'+g);cnt.set(g,a.length);E.push({h:g,t:a.length,c,p:Math.floor(n/per)});if(!c)a.forEach(i=>{E.push({i,g,p:Math.floor(n/per)});n++})})}

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  let sx=0,sy=0,sw=im.width,sh=im.height;const ra=imgc.r==='1:1'?1:imgc.r==='3:4'?.75:0;
  if(ra){if(sw/sh>ra){const w=sh*ra;sx=(sw-w)/2;sw=w}else{const h=sw/ra;sy=(sh-h)/2;sh=h}}
  const iq=IQ[imgc.q]||IQ.m,k=Math.min(1,iq[0]/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',iq[1]))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function pick(el,kind,get,set,after){
  let add=false;
  const draw=()=>{const v=get();
    el.innerHTML=add?`<input class="inp" style="flex:1;min-width:140px;width:auto" aria-label="Nama ${K[kind].t} baru" placeholder="Nama baru"><button class="chip" data-ok="1">Tambah</button><button class="chip" data-no="1">Batal</button>`
    :list(kind).map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===v}">${esc(c)}</button>`).join('')+'<button class="chip" data-add="1">+ Baru</button>';
    if(add)el.querySelector('input').focus();if(after)after()};
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.add!==undefined){add=true;return draw()}
    if(d.no!==undefined){add=false;return draw()}
    if(d.ok!==undefined){const v=el.querySelector('input').value.trim();if(v){if(!list(kind).includes(v)){opt[kind].push(v);saveOpt()}set(v)}add=false;return draw()}
    if(d.c!==undefined){set(d.c);draw()}};
  draw();
}

  <div class="fld">Warna aksen</div><div class="chips" id="ta" style="flex-wrap:wrap;overflow:visible;padding-top:8px">${ACC.map(a=>`<button class="sw2" data-a="${a[0]}" aria-label="${a[0]}"></button>`).join('')}<label class="sw2 cu" title="Warna sendiri"><input type="color" id="tc" aria-label="Warna sendiri" value="${acc&&acc.c||'#C42418'}"></label></div>
  <p class="hint">Warna dipakai untuk tombol, chip terpilih, dan label. Warna teks di atasnya menyesuaikan otomatis agar tetap terbaca.</p>`);
  const sws=()=>[...$('#ta').querySelectorAll('[data-a]')];
  const mark=()=>sws().forEach(x=>{const p=ACC.find(a=>a[0]===x.dataset.a);x.style.background=isDark()?p[2]:p[1];x.setAttribute('aria-pressed',acc?acc.n===x.dataset.a:x.dataset.a==='Merah')});
  mark();
  $('#tm').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;setMode(b.dataset.m);[...$('#tm').children].forEach(x=>x.setAttribute('aria-pressed',x===b));mark()};
  $('#ta').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;acc=b.dataset.a==='Merah'?null:{n:b.dataset.a};saveAcc();applyAcc();mark()};
  $('#tc').oninput=e=>{acc={c:e.target.value};saveAcc();applyAcc();mark()};
}
$('#sy').onclick=()=>cfg.url?(busy?toast('Sedang sinkron…'):sync(true)):syncUI();$('#pl').onclick=themeUI;
$('#gp').onclick=grouper;
$('#pg').onclick=e=>{const b=e.target.closest('[data-pg]');if(b&&!b.disabled){pg+=+b.dataset.pg;enter=true;render();$('#sc').scrollTop=0}};
$('#pg').onchange=e=>{if(e.target.id==='pgs'){pg=+e.target.value;enter=true;render();$('#sc').scrollTop=0}};
$('#sbw').onclick=e=>{if(e.target.id==='sbo'||e.target.closest('[data-x]'))return sbClose();const b=e.target.closest('[data-m]');if(!b)return;sbClose();const k=b.dataset.m;k==='stat'?statsUI('koleksi'):k==='tema'?themeUI():k==='sync'?syncUI():k==='wts'?wts():k==='bk'?backup():k==='foto'?photoUI():mgr(k)};
document.addEventListener('keydown',e=>{if(!$('#lb').hidden){if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')$('#lnx')&&$('#lnx').click();else if(e.key==='ArrowLeft')$('#lpv')&&$('#lpv').click();else return;e.stopImmediatePropagation();return}if(!$('#sbw').hidden&&e.key==='Escape'){sbClose();e.stopImmediatePropagation()}},true);

const EYE_ON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
let nbl=false;try{nbl=localStorage.getItem('diecast:nb')==='1'}catch(e){}
function paintNb(){document.body.classList.toggle('nb',nbl);$('#eye').innerHTML=nbl?EYE_OFF:EYE_ON;$('#eye').setAttribute('aria-pressed',nbl);$('#eye').setAttribute('aria-label',nbl?'Tampilkan nilai':'Sembunyikan nilai')}
function kwL(){try{return JSON.parse(localStorage.getItem('diecast:kw')||'[]')}catch(e){return []}}
function kwS(a){try{localStorage.setItem('diecast:kw',JSON.stringify(a))}catch(e){}}
const SCP={koleksi:['Koleksi',i=>!i.sold&&!i.po],po:['Pre Order',i=>i.po&&!i.sold],sell:['Dijual',i=>i.sell&&!i.sold],sold:['Terjual',i=>i.sold],all:['Semua',()=>true]};
const DIM={brand:'Merek',series:'Seri',scale:'Skala',seller:'Seller',pack:'Kemasan',state:'Kondisi',year:'Tahun beli',loc:'Lokasi'};
const stS={sc:'koleksi',dim:'brand'};let kwEd=null,kwDel=null;
const vOf=(i,sc,p)=>sc==='sold'?(i.sg||0)*(p?1:Q(i)):(p?(Number(p.price)||0):TP(i));
const kwMatch=(i,ks)=>{const t=[i.name,i.brand,i.series].join(' ').toLowerCase();return ks.some(k=>t.includes(String(k).toLowerCase()))};
function statRows(set,dim,sc){const m=new Map(),add=(k,u,v)=>{k=k||'(Kosong)';const e=m.get(k)||[0,0];e[0]+=u;e[1]+=v;m.set(k,e)};
  set.forEach(i=>{if(['pack','state','year','loc'].includes(dim))PS(i).forEach(p=>add(p[dim],1,vOf(i,sc,p)));else add(i[dim],Q(i),vOf(i,sc))});
  return [...m].map(([k,[u,v]])=>({k,u,v})).sort((a,b)=>b.u-a.u||b.v-a.v)}
function togNb(){nbl=!nbl;try{localStorage.setItem('diecast:nb',nbl?'1':'0')}catch(x){}paintNb()}
function statsUI(sc0){
  if(sc0)stS.sc=sc0;kwEd=null;kwDel=null;
  open(head('Statistik',1)+'<div id="sx"></div>');
  const sx=$('#sx');
  const row=(label,u,v,mx,sub)=>`<div class="sr"><div class="sh"><span>${esc(label)}${sub?` <small>${esc(sub)}</small>`:''}</span><span class="sv"><b>${u} unit</b><span class="mny">${money(v)}</span></span></div><div class="bar2"><i style="width:${mx?Math.round(u/mx*100):0}%"></i></div></div>`;
  const kwForm=g=>`<div class="pc"><label class="fld" style="margin-top:0">Nama kelompok<input class="inp" id="kl" value="${esc(g.l||'')}" placeholder="Contoh: Model Mobil"></label><label class="fld">Keyword (pisahkan dengan koma)<input class="inp" id="kk" value="${esc((g.k||[]).join(', '))}" placeholder="Contoh: R34, R35, Supra, 911 GT3"></label><div class="row2"><button class="btn o" data-kc="1" style="margin-top:12px">Batal</button><button class="btn" data-ks="${esc(g.id||'new')}" style="margin-top:12px">Simpan</button></div></div>`;
  const draw=()=>{
    const kws=kwL();if(stS.dim.startsWith('k:')&&!kws.some(g=>'k:'+g.id===stS.dim))stS.dim='brand';
    const [,fn]=SCP[stS.sc],set=items.filter(fn),U=set.reduce((a,i)=>a+Q(i),0),V=set.reduce((a,i)=>a+vOf(i,stS.sc),0);
    const cg=kws.find(g=>'k:'+g.id===stS.dim),sm=(a,f)=>a.reduce((x,i)=>x+f(i),0);
    let rows;
    if(cg){const used=new Set();rows=cg.k.map(k=>{const m=set.filter(i=>kwMatch(i,[k]));m.forEach(i=>used.add(i.id));return{k,u:sm(m,Q),v:sm(m,i=>vOf(i,stS.sc))}}).sort((a,b)=>b.u-a.u||b.v-a.v);
      const rest=set.filter(i=>!used.has(i.id));if(rest.length)rows.push({k:'Lainnya',u:sm(rest,Q),v:sm(rest,i=>vOf(i,stS.sc)),sub:'tidak cocok keyword manapun'})}
    else rows=statRows(set,stS.dim,stS.sc);
    const mx=rows.reduce((a,r)=>Math.max(a,r.u),0);
    sx.innerHTML=`<div class="chips" style="padding:4px 0 8px;align-items:center">${Object.entries(SCP).map(([k,v])=>`<button class="chip" data-sc="${k}" aria-pressed="${k===stS.sc}">${v[0]}</button>`).join('')}<button class="ghost ic" data-eye="1" style="margin-left:auto" aria-label="${nbl?'Tampilkan nilai':'Sembunyikan nilai'}">${nbl?EYE_OFF:EYE_ON}</button></div>
    <div class="stats" style="margin:0 0 4px"><div class="st d"><div class="stm"><small>Total unit</small><b>${U}</b></div></div><div class="st"><div class="stm"><small>${stS.sc==='sold'?'Nilai jual':'Nilai beli'}</small><b class="mny" style="font-size:20px">${money(V)}</b></div></div><div class="st"><div class="stm"><small>Rata-rata per unit</small><b class="mny" style="font-size:20px">${U?money(Math.round(V/U)):'Rp 0'}</b></div></div></div>
    <div class="fld">Berdasarkan</div><div class="chips" style="flex-wrap:wrap;overflow:visible;padding-top:6px">${Object.entries(DIM).map(([k,t])=>`<button class="chip" data-dm="${k}" aria-pressed="${k===stS.dim}">${t}</button>`).join('')}${kws.map(g=>`<button class="chip" data-dm="k:${esc(g.id)}" aria-pressed="${'k:'+g.id===stS.dim}">${esc(g.l||g.k.join(', '))}</button>`).join('')}<button class="chip" data-kn="1" style="border-style:dashed" aria-label="Tambah kelompok keyword">+ Tambah</button></div>
    ${kwEd==='new'?kwForm({}):''}
    ${cg&&kwEd!==cg.id?`<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span class="hint" style="flex:1;margin:0">Keyword: ${esc(cg.k.join(', '))}. Satu model bisa terhitung di beberapa keyword.</span><button class="ghost" data-ke="${esc(cg.id)}" style="height:36px;font-size:13px">Ubah</button><button class="ghost" data-kd="${esc(cg.id)}" style="height:36px;font-size:13px;${kwDel===cg.id?'color:var(--bad);border-color:var(--bad)':''}">${kwDel===cg.id?'Yakin hapus?':'Hapus'}</button></div>`:''}
    ${cg&&kwEd===cg.id?kwForm(cg):''}
    ${rows.length?rows.map(r=>row(r.k,r.u,r.v,mx,r.sub)).join(''):'<p class="hint">Belum ada data.</p>'}
    ${!kws.length&&kwEd!=='new'?'<p class="hint" style="margin-top:16px">Ingin statistik sendiri? Ketuk “+ Tambah”, misalnya kelompok “Model Mobil” dengan keyword R34, R35, Supra. Setiap keyword jadi satu baris dengan jumlah dan nilainya.</p>':''}`;
  };
  sx.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.sc){stS.sc=d.sc;draw()}
    else if(d.dm){stS.dim=d.dm;kwEd=null;kwDel=null;draw()}
    else if(d.eye!==undefined){togNb();draw()}
    else if(d.kn!==undefined){kwEd='new';kwDel=null;draw();$('#kl').focus()}
    else if(d.ke!==undefined){kwEd=d.ke;kwDel=null;draw();$('#kl').focus()}
    else if(d.kc!==undefined){kwEd=null;draw()}
    else if(d.kd!==undefined){if(kwDel===d.kd){kwS(kwL().filter(g=>g.id!==d.kd));kwDel=null;stS.dim='brand'}else kwDel=d.kd;draw()}
    else if(d.ks!==undefined){const ks=$('#kk').value.split(',').map(x=>x.trim()).filter(Boolean);if(!ks.length){toast('Isi minimal satu keyword.');return}
      const lab=$('#kl').value.trim()||ks.join(', '),a=kwL();
      if(d.ks==='new'){const id='k'+Date.now().toString(36);a.push({id,l:lab,k:ks});stS.dim='k:'+id}else{const g=a.find(x=>x.id===d.ks);if(g){g.l=lab;g.k=ks}}
      kwS(a);kwEd=null;draw();toast('Tersimpan.')}};
  draw();
}
$('#stt').onclick=e=>{if(e.target.closest('#eye')){togNb();return}const b=e.target.closest('[data-st]');if(b)statsUI(b.dataset.st)};
paintNb();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)close()});
applyAcc();

render();qs(2);
</script>
